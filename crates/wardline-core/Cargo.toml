[package]
name = "wardline-core"
description = "Synchronous, embeddable guardrail evaluation core: the Guard trait, Verdict, fail policies, and the blocking pipeline executor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "../../README.md"

[features]
default = []
# Structured spans/events per guard. Off by default so embedders who do not
# want a telemetry dependency compile against `std` only.
tracing = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
