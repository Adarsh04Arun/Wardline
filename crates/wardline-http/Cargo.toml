[package]
name = "wardline-http"
description = "tower/axum middleware adapter for Wardline pipelines. The one async boundary in the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/wardline-http"

[dependencies]
axum = { version = "0.8", default-features = false }
bytes = "1"
http-body-util = "0.1"
tower = { version = "0.5", default-features = false }
wardline-core.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
wardline-guards.workspace = true

[lints]
workspace = true
