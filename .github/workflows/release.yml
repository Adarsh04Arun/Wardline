name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  publish:
    name: tag checks and crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt / clippy / test / rustdoc
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo doc --workspace --no-deps --all-features

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
            echo "Add a crates.io API token as the CARGO_REGISTRY_TOKEN repo secret, then re-run this workflow."
            exit 0
          fi
          publish() {
            local crate="$1"
            local i
            for i in $(seq 1 12); do
              if cargo publish -p "$crate"; then
                return 0
              fi
              echo "retry $crate in 20s ($i/12) — waiting for the crates.io index"
              sleep 20
            done
            echo "failed to publish $crate"
            return 1
          }
          publish wardline-core
          publish wardline-guards
          publish wardline-http
          publish wardline-llm
