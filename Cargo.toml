[workspace]
resolver = "3"
# Members are listed explicitly rather than globbed: a `crates/*` glob breaks
# if the checkout path contains glob metacharacters (e.g. `[1]_wardline`).
members = [
    "crates/wardline-core",
    "crates/wardline-guards",
    "crates/wardline-http",
    "crates/wardline-llm",
    "examples/sync_http_server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Adarsh04Arun/Wardline"
homepage = "https://github.com/Adarsh04Arun/Wardline"
authors = ["The Wardline contributors"]
categories = ["development-tools", "web-programming"]
keywords = ["guardrails", "llm", "safety", "policy", "middleware"]

[workspace.dependencies]
wardline-core = { version = "0.1.0", path = "crates/wardline-core" }
wardline-guards = { version = "0.1.0", path = "crates/wardline-guards" }
wardline-http = { version = "0.1.0", path = "crates/wardline-http" }
wardline-llm = { version = "0.1.0", path = "crates/wardline-llm" }

# `unsafe_code = forbid` and `missing_docs = deny` live as crate-root
# attributes instead (see AGENTS.md invariant 7) so they are visible in the
# source file they apply to.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "unwind"
